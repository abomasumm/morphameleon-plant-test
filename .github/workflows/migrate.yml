# Copy this file to .github/workflows/migrate.yml, then add your Token Factory key as a repository secret
# named NEBIUS_API_KEY. Start a run from the Actions tab: Migrate > Run workflow.
name: Migrate
on:
  workflow_dispatch:
    inputs:
      command:
        description: What to do
        type: choice
        options: [start, resume, approve, reject, retry, restart]
        default: start
      to:
        description: Migrate to, e.g. TypeScript, strict mode (start and restart)
      from:
        description: Migrate from (detected when empty)
      must:
        description: Behaviour that must not change, separated by semicolons
      task:
        description: Task id for approve, reject or retry, e.g. T-003
      note:
        description: Why you rejected a task, or a hint for a retry
permissions:
  contents: write
  pull-requests: write
concurrency: morphameleon
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: abomasumm/Morphameleon@github-action
        with:
          api-key: ${{ secrets.NEBIUS_API_KEY }}
          command: ${{ inputs.command }}
          to: ${{ inputs.to }}
          from: ${{ inputs.from }}
          must: ${{ inputs.must }}
          task: ${{ inputs.task }}
          note: ${{ inputs.note }}
